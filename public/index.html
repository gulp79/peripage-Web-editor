<!doctype html>
<html class="dark h-full" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeriPage Studio · Modern Web Bluetooth Thermal Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Anton&family=Bebas+Neue&family=Bungee&family=Bungee+Shade&family=Monoton&family=Righteous&family=Rubik+Mono+One&family=Archivo+Black&family=Titan+One&family=Alfa+Slab+One&family=Press+Start+2P&family=Silkscreen&family=VT323&family=Permanent+Marker&family=Caveat:wght@400;700&family=Rock+Salt&family=Gloria+Hallelujah&family=Shadows+Into+Light&family=Lobster&family=Pacifico&family=Special+Elite&family=Courier+Prime:wght@400;700&family=UnifrakturMaguntia&family=Creepster&family=Nosifer&family=Playfair+Display:wght@400;700&family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&family=Major+Mono+Display&family=Black+Ops+One&family=Noto+Emoji&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">

  <!-- ================= LEFT : content ================= -->
  <div class="col left">
    <div class="hdr">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:26px; height:26px; border-radius:6px; background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3); display:flex; align-items:center; justify-content:center; color:#3B82F6;">
          <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>PeriPage Studio</h1>
      </div>
      <span class="spacer"></span>
      <button class="mini ghost" id="btnCollapse" title="Collapse all">⇕</button>
      <button class="mini ghost danger" id="btnClear" title="Remove everything">Clear</button>
    </div>

    <div class="sec">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--tx2)">Add Content Block</span>
        <span style="font-size:9.5px; font-family:JetBrains Mono,monospace; color:var(--tx2)"></span>
      </div>
      <div class="addbar">
        <button data-add="text">
          <svg style="width:14px;height:14px;color:#3B82F6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16m-7 6h7"/></svg>
          Text
        </button>
        <button data-add="image">
          <svg style="width:14px;height:14px;color:#A855F7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Image
        </button>
        <button data-add="qr">
          <svg style="width:14px;height:14px;color:#10B981" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
          QR code
        </button>
        <button data-add="barcode">
          <svg style="width:14px;height:14px;color:#F59E0B" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h2v12H4zm4 0h1v12H8zm3 0h2v12h-2zm4 0h1v12h-1zm3 0h2v12h-2z"/></svg>
          Barcode
        </button>
        <button data-add="rule">
          <svg style="width:14px;height:14px;color:var(--tx2)" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12h16"/></svg>
          Divider
        </button>
        <button data-add="space">
          <svg style="width:14px;height:14px;color:#38BDF8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 9l4-4 4 4m0 6l-4 4-4-4"/></svg>
          Spacer
        </button>
      </div>
    </div>

    <div class="sec" id="secPresets">
      <div class="preset-hdr" id="presetHdr">
        <span class="chev">▶</span>
        <h2>Presets</h2>
        <span class="spacer"></span>
        <button type="button" class="preset-add-btn" id="btnOpenPresetModal" title="Open Preset Manager" style="margin-right:4px;">⚙</button>
        <button type="button" class="preset-add-btn" id="btnPresetToggle" title="Save current document as preset">＋</button>
      </div>
      <div id="presetBody" style="display:none">
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <button type="button" id="btnShowSavePreset" class="primary" style="flex:1; font-size:11.5px; padding:6px 8px; display:flex; align-items:center; justify-content:center; gap:5px;">
            <span>＋</span> Save as Preset
          </button>
          <button type="button" id="btnManagePresets" class="mini" style="padding:6px 10px; font-size:11.5px; display:flex; align-items:center; gap:4px;" title="Manage all presets in modal">
            <span>⚙</span> Manage
          </button>
        </div>
        <form id="presetSaveForm" class="preset-save-form" style="display:none;">
          <div style="display:flex; flex-direction:column; gap:6px;">
            <input type="text" id="presetNameInput" placeholder="Preset name (e.g. Freezer Label)" maxlength="30" required>
            <input type="text" id="presetDescInput" placeholder="Short description (optional)" maxlength="60">
            <div style="display:flex; gap:6px;">
              <button type="submit" id="btnPresetSave" class="primary" style="flex:1; font-size:11px; padding:5px 8px;">Save Preset</button>
              <button type="button" id="btnPresetCancel" class="ghost" style="font-size:11px; padding:5px 8px;">Cancel</button>
            </div>
          </div>
        </form>
        <div class="preset-grid" id="presetGrid"></div>
        <div class="preset-actions" style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">
          <div style="display:flex; gap:6px;">
            <button type="button" class="mini" id="btnExportPresets" style="flex:1" title="Download all custom presets as a JSON file">↓ Export Presets</button>
            <button type="button" class="mini" id="btnImportPresets" style="flex:1" title="Import presets from a JSON file">↑ Import Preset</button>
          </div>
          <button type="button" class="mini ghost" id="btnExportCurrentPreset" style="width:100%; font-size:11px; border:1px dashed var(--line);" title="Export currently open label directly as a JSON preset file">
            ↓ Export Current Label (.json)
          </button>
          <input type="file" id="presetImportInput" accept=".json,application/json" style="display:none">
        </div>
      </div>
    </div>
    
    <div style="padding:6px 12px 0; display:flex; align-items:center; justify-content:between;">
      <span style="font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--tx2)">Block Stack</span>
    </div>
    <div id="list"></div>
    <div class="spacer"></div>
    <div class="sec" style="background:rgba(22,26,36,0.6)">
      <div class="grid3">
        <button class="mini" id="btnSave">Save</button>
        <button class="mini" id="btnLoad">Load</button>
        <button class="mini" id="btnPng">Export PNG</button>
      </div>
    </div>
  </div>

  <!-- ================= CENTER : preview ================= -->
  <div class="col center dot-pattern">
    <div id="stagebar">
      <strong style="font-size:12.5px; font-weight:600">Preview</strong>
      <span class="pill" id="pillDims">–</span>
      <span class="pill" id="pillBytes">–</span>
      <span class="spacer"></span>
      <label style="margin:0; font-size:11px">Zoom</label>
      <select id="zoom" style="width:78px; font-size:11px; padding:4px">
        <option value="1">1×</option>
        <option value="1.5" selected>1.5×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
      </select>
      <button class="mini" id="btnGrid" title="Toggle 1:1 dot grid">Dots</button>
    </div>
    <div id="stage">
      <div id="paper"><canvas id="cv" width="384" height="10"></canvas><div class="tearline"></div></div>
    </div>
    <div style="position:absolute; bottom:10px; left:14px; font-family:JetBrains Mono,monospace; font-size:10px; color:var(--tx2); background:rgba(17,20,28,0.9); border:1px solid var(--line); padding:4px 8px; border-radius:5px; pointer-events:none">
      ESC/POS 1-bit Pixel Grid · 203 DPI
    </div>
  </div>

  <!-- ================= RIGHT : printer ================= -->
  <div class="col right">
    <div class="hdr">
      <span class="dot" id="dot"></span>
      <h1 id="devName" style="font-size:12.5px; font-family:JetBrains Mono,monospace">Not connected</h1>
    </div>

    <div class="sec">
      <h2>Connection</h2>
      <div class="f grid2">
        <button class="primary" id="btnConnect" style="font-size:11.5px">Connect</button>
        <button id="btnDisconnect" disabled style="font-size:11.5px">Disconnect</button>
      </div>
      <div class="f">
        <label>Device filter</label>
        <select id="filterMode" style="font-size:11.5px">
          <option value="name">PeriPage / PPG name prefix</option>
          <option value="all">All Bluetooth devices</option>
        </select>
      </div>
      <div class="f">
        <label>Write characteristic</label>
        <select id="charSel" style="font-size:11.5px; font-family:JetBrains Mono,monospace"><option value="">— connect to discover —</option></select>
        <div class="hint" style="margin-top:4px">Auto-picked. Change it if printing does nothing.</div>
      </div>
    </div>

    <div class="sec" style="background:linear-gradient(180deg, rgba(59,130,246,0.06), rgba(22,26,36,0.4)); border-color:rgba(59,130,246,0.25)">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;">
        <h2 style="margin:0; color:#60A5FA">Print</h2>
        <span style="font-size:9.5px; font-family:JetBrains Mono,monospace; color:#3B82F6">Thermal ready</span>
      </div>
      <div class="f grid2">
        <button class="primary" id="btnPrint" disabled style="font-size:12px; padding:8px">Print <span style="font-size:9.5px; opacity:0.8; font-family:JetBrains Mono">⌘P</span></button>
        <button id="btnTest" disabled style="font-size:11.5px">Test strip</button>
      </div>
      <div class="grid2" style="margin-bottom:6px">
        <button class="mini" id="btnFeed" disabled>Feed paper</button>
        <button class="mini" id="btnReset" disabled>Reset printer</button>
      </div>
      <button class="mini" id="btnProbe" disabled style="width:100%; margin-top:4px; font-family:JetBrains Mono,monospace">Probe every characteristic</button>
      <div id="prog"><div id="progbar"></div></div>
    </div>

    <div class="sec">
      <h2>Printer Settings</h2>
      <div class="f">
        <label>Paper width</label>
        <select id="paperW" style="font-size:11.5px">
          <option value="384" selected>A6/mini · 58 mm · 384 dots</option>
          <option value="576">A6+ / A40 · 576 dots</option>
          <option value="832">80 mm · 832 dots</option>
        </select>
      </div>
      <div class="f">
        <label>Darkness</label>
        <div class="swatch" id="density">
          <button data-d="0">Light</button><button data-d="1" class="on">Normal</button><button data-d="2">Dark</button>
        </div>
      </div>
      <div class="f grid2">
        <div><label>Feed after (px)</label><input type="number" id="feed" value="80" min="0" max="255" style="font-family:JetBrains Mono"></div>
        <div><label>Rows / packet</label><input type="number" id="chunkRows" value="255" min="8" max="255" style="font-family:JetBrains Mono"></div>
      </div>
      <div class="f">
        <label>Transfer mode</label>
        <select id="txMode" style="font-size:11.5px">
          <option value="rows">Row by row (matches reference)</option>
          <option value="bulk" selected>Bulk packets (faster)</option>
        </select>
      </div>
      <div class="f grid2">
        <div><label>BLE packet (bytes)</label>
          <select id="mtu" style="font-family:JetBrains Mono; font-size:11.5px">
            <option value="20">20 (safest)</option>
            <option value="100" selected>100</option>
            <option value="120">120</option>
            <option value="128">128</option>
            <option value="160">160</option>
            <option value="180">180</option>
            <option value="244">244</option>
            <option value="500">500</option>
          </select>
        </div>
        <div><label>Delay (ms)</label><input type="number" id="delay" value="12" min="0" max="500" style="font-family:JetBrains Mono"></div>
      </div>
    </div>

    <div class="sec">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;">
        <h2 style="margin:0">Log</h2>
        <button class="mini ghost" id="btnClearLog" style="font-size:10px">Clear</button>
      </div>
      <div id="log"></div>
    </div>

    <div class="sec" id="secWarn"></div>
  </div>
</div>

<div id="emojiModal" hidden>
  <div class="epanel">
    <div class="ehead">
      <input type="text" id="emojiSearch" placeholder="Search emoji…" autocomplete="off">
      <button class="mini" id="emojiClose">Close</button>
    </div>
    <div class="ecats" id="emojiCats"></div>
    <div class="egrid" id="emojiGrid"></div>
  </div>
</div>

<div id="presetModal" hidden>
  <div class="epanel" style="width:580px; max-width:94vw; max-height:82vh;">
    <div class="ehead" style="justify-content:space-between; padding:12px 14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:16px;">📁</span>
        <strong style="font-size:13.5px; font-weight:600;">Preset Manager</strong>
        <span id="presetModalCount" class="pill" style="font-size:11px;">0 presets</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button class="mini" id="btnModalImport" title="Import presets from JSON file">↑ Import</button>
        <button class="mini" id="btnModalExportAll" title="Export all custom presets as JSON">↓ Export All</button>
        <button class="mini" id="presetModalClose" style="font-size:14px; line-height:1; padding:3px 8px;" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div style="padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; background:rgba(22,26,36,0.6);">
      <input type="text" id="presetSearch" placeholder="Search presets by name or description…" autocomplete="off" style="font-size:12px; padding:6px 10px;">
      <button type="button" class="primary mini" id="btnModalSaveCurrent" style="white-space:nowrap; padding:6px 12px; font-size:11.5px;">＋ Save Current</button>
    </div>
    <div id="presetModalList" style="padding:12px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; flex:1;"></div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
