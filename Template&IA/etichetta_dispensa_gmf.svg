<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="384px"
   height="220px"
   viewBox="0 0 384 220"
   version="1.1"
   id="svg_dispensa_label">
  
  <!-- 01 Background and Border -->
  <g inkscape:groupmode="layer" inkscape:label="01 Background and Border" id="layer_01_background">
    <rect
       id="outer-border"
       x="4"
       y="4"
       width="376"
       height="212"
       rx="16"
       ry="16"
       fill="#FFFFFF"
       stroke="#000000"
       stroke-width="3" />
  </g>

  <!-- 02 Header -->
  <g inkscape:groupmode="layer" inkscape:label="02 Header" id="layer_02_header">
    <path
       id="header-background"
       d="M 5.5,20 C 5.5,12 12,5.5 20,5.5 L 364,5.5 C 372,5.5 378.5,12 378.5,20 L 378.5,70 L 5.5,70 Z"
       fill="#000000" />
    
    <text
       id="header-main"
       x="215"
       y="45"
       fill="#FFFFFF"
       font-family="Arial, sans-serif"
       font-weight="bold"
       font-size="21"
       text-anchor="middle">La dispensa di G&amp;M&amp;F</text>
  </g>

  <!-- 05 Optional Icon -->
  <g inkscape:groupmode="layer" inkscape:label="05 Optional Icon" id="layer_05_icon">
    <g id="optional-icon" transform="translate(24, 16)" fill="#FFFFFF">
      <path d="M 10 7 C 7 7 4 10 4 14 C 4 23 10 29 20 29 C 30 29 36 23 36 14 C 36 10 33 7 30 7 Z M 12 10 L 28 10 C 31 10 33 11 33 14 C 33 20 27 26 20 26 C 13 26 7 20 7 14 C 7 11 9 10 12 10 Z" />
      <path d="M 18 3.5 C 18 3.5 20 1.8 22.5 1.8 C 23.5 1.8 23.5 3.5 21.8 5 C 20 6.7 18 6.7 18 6.7 Z" />
      <circle cx="20" cy="17.5" r="3.5" />
    </g>
  </g>

  <!-- 03 Main Information -->
  <g inkscape:groupmode="layer" inkscape:label="03 Main Information" id="layer_03_main">
    <text
       id="field-1-label"
       x="24"
       y="98"
       fill="#000000"
       font-family="Arial, sans-serif"
       font-weight="bold"
       font-size="11"
       letter-spacing="1.5">CIBO / SOSTANZA CONTENUTA</text>
    <text
       id="main-value"
       x="24"
       y="132"
       fill="#000000"
       font-family="Arial, sans-serif"
       font-weight="bold"
       font-size="26">PASTA INTEGRALE</text>
  </g>

  <!-- 04 Additional Fields -->
  <g inkscape:groupmode="layer" inkscape:label="04 Additional Fields" id="layer_04_additional">
    <text
       id="field-2-label"
       x="24"
       y="164"
       fill="#000000"
       font-family="Arial, sans-serif"
       font-weight="bold"
       font-size="11"
       letter-spacing="1.5">DATA IMBUSTAMENTO / SIGILLATURA</text>
    <text
       id="field-2-value"
       x="24"
       y="194"
       fill="#000000"
       font-family="Arial, sans-serif"
       font-weight="bold"
       font-size="20">06 / 11 / 2026</text>
  </g>

  <!-- 99 Safe Area Guide -->
  <g
     inkscape:groupmode="layer"
     inkscape:label="99 Safe Area Guide"
     id="layer_99_safe_area"
     style="display:none">
    <rect
       x="16"
       y="16"
       width="352"
       height="188"
       fill="none"
       stroke="#FF0000"
       stroke-width="1"
       stroke-dasharray="4,4" />
  </g>
</svg>
